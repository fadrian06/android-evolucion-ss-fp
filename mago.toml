#:schema https://mago.carthage.software/1.59.0/schema.json

[source]
paths = [
  "app",
  "database",
  "resources/views",
  "routes",
  "tests",
  "index.php",
]
includes = ["vendor"]

[linter.rules]
braced-string-interpolation.enabled = false
no-ini-set.enabled = false

[formatter]
tab-width = 2
print-width = 80
preserve-breaking-argument-list = true
parentheses-in-new-expression = false
